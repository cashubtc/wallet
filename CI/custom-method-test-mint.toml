# Opt-in custom-method tests. Requires cdk-mintd v0.18.0; fake funds only.
# Initialize with: cdk-mintd --work-dir <dir> config init --new-mint --file <this file>
# Set CUSTOM_METHOD_TEST_MNEMONIC to a disposable test mnemonic for init and startup.
[info]
url = "http://127.0.0.1:3349"
listen_host = "127.0.0.1"
listen_port = 3349
mnemonic = "env:CUSTOM_METHOD_TEST_MNEMONIC"
input_fee_ppk = 0

[mint_info]
name = "Custom method test mint"

[database]
engine = "sqlite"

[[payment_backend]]
backend = "fakewallet"
unit = "sat"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[[payment_backend]]
backend = "fakewallet"
unit = "bux"
min_mint = 1
max_mint = 500000
min_melt = 1
max_melt = 500000

[fake_wallet]
supported_units = ["sat", "bux"]
fee_percent = 0.0
reserve_fee_min = 2
custom_payment_methods = [{ method = "branch", unit = "bux" }]
min_delay_time = 0
max_delay_time = 0
