name: iOS Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'ios/**'
      - 'CI/**'
      - '.github/workflows/ios-tests.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Payment test depth
        type: choice
        default: pr
        options: [pr, full]

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NUTSHELL_MINT_URL: http://localhost:3338
  CDK_MINT_URL: http://127.0.0.1:3339
  PAYMENT_TIER: ${{ (github.event_name == 'schedule' && 'full') || inputs.tier || 'pr' }}
  TEST_RUNNER_PAYMENT_FIXTURE_URL: http://127.0.0.1:3341
  TEST_RUNNER_PAYMENT_TEST_TIER: ${{ (github.event_name == 'schedule' && 'full') || inputs.tier || 'pr' }}

jobs:
  build:
    name: Build iOS test products
    runs-on: macos-26
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5'
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/SourcePackages
        key: ios-test-packages-macos-26-arm64-xcode-26.5-${{ hashFiles('ios/CashuWallet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
    - name: Validate shard routing and coverage aggregation
      run: |
        python3 -m unittest discover -s CI/tests -v
        python3 -m unittest discover -s CI/payment-tests -p test_coverage.py -v
    - name: Build iOS tests once
      run: |
        set -euo pipefail
        xcodebuild build-for-testing \
          -project ios/CashuWallet.xcodeproj \
          -scheme CashuWallet \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/CashuWalletDerivedData" \
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
          -skipPackageUpdates \
          -skipPackagePluginValidation \
          -showBuildTimingSummary \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
          CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" \
          2>&1 | tee build-output.log | xcbeautify
    - name: Package relocatable test products
      run: |
        # tar preserves executable permissions and framework symlinks. Include
        # the xctestrun file and all products; no source checkout/package cache
        # or build intermediates are needed by test-without-building.
        tar -czf "$RUNNER_TEMP/ios-test-products.tar.gz" \
          -C "$RUNNER_TEMP/CashuWalletDerivedData/Build" Products
    - uses: actions/upload-artifact@v4
      with:
        name: ios-test-products
        path: ${{ runner.temp }}/ios-test-products.tar.gz
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
    - name: Upload build diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-diagnostics
        path: build-output.log

  test:
    name: iOS tests (${{ matrix.shard }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, ui-lifecycle, ui-settings, ui-other]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Restore local mint runtimes
      uses: actions/cache@v4
      with:
        path: |
          CI/.nutshell-venv
          CI/.cdk-bin
        key: ios-test-mints-v2-macos-26-arm64-python-3.11-${{ hashFiles('CI/setup-nutshell.sh', 'CI/setup-cdk.sh') }}
    - uses: actions/download-artifact@v4
      with:
        name: ios-test-products
        path: ${{ runner.temp }}
    - name: Unpack products and boot simulator
      run: |
        set -euo pipefail
        tar -xzf "$RUNNER_TEMP/ios-test-products.tar.gz" -C "$RUNNER_TEMP"
        SIMULATOR_UDID="$(
          xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name == "iPhone 17" and .isAvailable == true)] | last | .udid // empty'
        )"
        if [ -z "$SIMULATOR_UDID" ]; then
          echo "iPhone 17 simulator is not available"
          exit 1
        fi
        echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
        xcrun simctl boot "$SIMULATOR_UDID"
        # Mint setup can proceed while the simulator boots. The test script
        # waits for boot completion before launching tests.
    - name: Setup local test mints
      id: setup_mints
      run: |
        set -euo pipefail
        chmod +x CI/setup-nutshell.sh CI/setup-cdk.sh

        # Match setup-python and the mint cache key; do not prefer a different
        # preinstalled Python version on the runner image.
        PYTHON="$pythonLocation/bin/python" ./CI/setup-nutshell.sh &
        NUTSHELL_SETUP_PID=$!
        # The shared multi-unit profile enables the USD UI payment journey.
        ./CI/setup-cdk.sh 3339 android &
        CDK_SETUP_PID=$!

        STATUS=0
        wait "$NUTSHELL_SETUP_PID" || STATUS=$?
        wait "$CDK_SETUP_PID" || STATUS=$?
        exit "$STATUS"

    - name: Start local test mints
      id: start_mints
      run: |
        set -euo pipefail
        chmod +x CI/start-nutshell.sh CI/start-cdk.sh

        ./CI/start-nutshell.sh &
        NUTSHELL_START_PID=$!
        ./CI/start-cdk.sh &
        CDK_START_PID=$!

        python3 CI/receipt-recovery-proxy.py > "$RUNNER_TEMP/receipt-proxy.log" 2>&1 &
        echo $! > "$RUNNER_TEMP/receipt-proxy.pid"
        STATUS=0
        wait "$NUTSHELL_START_PID" || STATUS=$?
        wait "$CDK_START_PID" || STATUS=$?
        if [ "$STATUS" != 0 ]; then exit "$STATUS"; fi
        ./CI/start-payment-fixtures.sh
        if [ "$SHARD" = unit ]; then
          CI/.nutshell-venv/bin/python -m unittest discover -s CI/payment-tests -v
        fi

    - name: Run test shard
      id: tests
      timeout-minutes: 25
      run: bash CI/run-ios-test-shard.sh "$SHARD"

    - name: Export test results and timings
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ios-results"
        xcrun xcresulttool get test-results tests \
          --path "$RUNNER_TEMP/$SHARD.xcresult" \
          > "$RUNNER_TEMP/ios-results/$SHARD.json"
        xcrun xcresulttool get test-results summary \
          --path "$RUNNER_TEMP/$SHARD.xcresult" \
          > "$RUNNER_TEMP/ios-results/$SHARD-summary.json"
        {
          echo "### $SHARD"
          echo '```json'
          cat "$RUNNER_TEMP/ios-results/$SHARD-summary.json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload test reports
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: ios-reports-${{ matrix.shard }}
        path: ${{ runner.temp }}/ios-results/*.json
        if-no-files-found: error

    - name: Stop local test mints
      if: always()
      run: |
        chmod +x CI/stop-nutshell.sh CI/stop-cdk.sh
        if [ -f "$RUNNER_TEMP/receipt-proxy.pid" ]; then kill "$(cat "$RUNNER_TEMP/receipt-proxy.pid")" || true; fi
        ./CI/stop-payment-fixtures.sh
        ./CI/stop-nutshell.sh &
        NUTSHELL_STOP_PID=$!
        ./CI/stop-cdk.sh &
        CDK_STOP_PID=$!
        wait "$NUTSHELL_STOP_PID" || true
        wait "$CDK_STOP_PID" || true

    - name: Upload failed test diagnostics
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ios-diagnostics-${{ matrix.shard }}
        path: |
          ios-test-output.log
          ${{ runner.temp }}/${{ matrix.shard }}.xcresult
          ${{ runner.temp }}/simulator-boot.log
          ${{ runner.temp }}/receipt-proxy.log
          CI/.nutshell.log
          CI/.cdk.log

  ios-tests:
    # Preserve the existing required check name. Never let a skipped, failed,
    # or cancelled shard turn the combined check green.
    name: iOS Unit, Mint Integration & UI Tests
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Check every test job succeeded
      env:
        BUILD_RESULT: ${{ needs.build.result }}
        TEST_RESULT: ${{ needs.test.result }}
      run: |
        test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
    - uses: actions/download-artifact@v4
      with:
        pattern: ios-reports-*
        merge-multiple: true
        path: ios-results
    - name: Enforce combined payment coverage
      run: |
        python3 CI/payment-tests/check_coverage.py --platform ios --tier "$PAYMENT_TIER" --ios-json \
          ios-results/unit.json ios-results/ui-lifecycle.json \
          ios-results/ui-settings.json ios-results/ui-other.json
